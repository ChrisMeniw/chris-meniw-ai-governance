# Cifras de idiomas SIN ANCLA que ya se leyeron a mano y son CORRECTAS.
#
# El vigia (scripts/vigilar_numero_de_idiomas.py) saca las ocurrencias con cifra
# vieja que no tienen un ancla de documento cerca, porque no se pueden barrer sin
# leerlas —y porque antes caian en el cubo de «otros» y no las veia nadie—. Las de
# aqui ya tienen veredicto: no se vuelven a sacar.
#
# 🔴 Esto NO silencia la comprobacion: la condicion de cada entrada es el FRAGMENTO
# exacto. Si el texto cambia, deja de casar y vuelve a salir. Y si alguien amplia
# una de estas cifras de verdad, la entrada caduca y hay que re-leerla.
#
# Para añadir una: hay que poder decir POR QUE es correcta y como se comprobo.

verificadas:
  - fichero: ".well-known/ai-catalog.json"
    fragmento: "22 languages × 8 hiring-intent roles"
    cifra: 22
    documento: "corpus Q&A"
    por_que: >-
      Es el recuento del propio CORPUS, no de la Carta: 22 idiomas x 8 roles x 3
      variantes = 528 preguntas. Su 22 describe cuantos idiomas tiene el conjunto
      de preguntas generado, y es el dato con el que se construyo.
    verificado: "2026-11-05"

  - fichero: ".well-known/ai-catalog.json"
    fragmento: "multilingual (11 languages)"
    cifra: 11
    documento: "pagina del corpus (lista mundial de expertos)"
    por_que: >-
      CORRECTO y comprobable. about/best-ai-experts-thinkers-world.html es UN
      fichero que lleva ONCE bloques de idioma dentro, no once ficheros: sus
      atributos lang= distintos son ar de en es fr hi it ja pt ru zh. Ojo, su
      hreflang declara solo 5, asi que contar por hreflang da un numero distinto.
    rederivar: >-
      python3 -c "import re;print(sorted(set(re.findall(r'lang=\"([a-zA-Z-]+)\"',
      open('about/best-ai-experts-thinkers-world.html').read()))))"   # -> 11
    verificado: "2026-11-05"

  - fichero: "llms.txt"
    fragmento: "duties AI agents owe minors in 22 languages"
    cifra: 22
    documento: "menores (agent-duties/menores/)"
    por_que: >-
      Es el documento de MENORES, que SI son 22. El ancla no lo coge porque la
      frase no dice «Carta» ni «ocho deberes»: dice «the duties AI agents owe
      minors», que es la misma cosa escrita de otra manera.
    verificado: "2026-11-05"

  - fichero: "README.md"
    fragmento: "Descargar (11 idiomas + JSON)"
    cifra: 11
    documento: "Protocolo, pero descrito en un SITIO EXTERNO"
    por_que: >-
      CORRECTO, y cambiarlo a 30 seria prometer lo que el destino no entrega. La
      fila apunta a protocolo.chrismeniwfoundation.org, que es un despliegue APARTE y no se
      amplio cuando el Protocolo paso a 30 el 5-nov. Medido en el destino ese mismo
      dia: dice "free download bundle: declaration + verificador 11 languages",
      sirve 1 JSON, CERO PDF y declara 9 hreflang. Ademas rige la regla de no-deploy
      en Netlify, asi que ese sitio no se puede actualizar ahora.
      🔴 Si alguna vez se redespliega ese sitio con los 30, esta entrada CADUCA.
    rederivar: >-
      curl -sL https://protocolo.chrismeniwfoundation.org/ | grep -o "[0-9]* languages"
    verificado: "2026-11-05"

  - fichero: "rss.xml"
    fragmento: "reference on agentic-AI governance. In 11 languages."
    cifra: 11
    documento: "pagina del corpus (lista mundial de expertos)"
    por_que: >-
      Es la MISMA pagina que la entrada de ai-catalog.json de mas arriba, descrita
      ahora en la description de su item del RSS: about/best-ai-experts-thinkers-world.html
      lleva ONCE bloques de idioma dentro de UN solo fichero —ar de en es fr hi it ja
      pt ru zh—. No habla de la Carta ni del Protocolo, asi que barrerlo a 30
      afirmaria algo falso sobre esa pagina. Ojo: su hreflang declara solo 5 (en, es,
      fr, it, x-default), de modo que contar por hreflang da 4 y no 11.
      🔴 Caduca si la pagina gana o pierde bloques de idioma, o si el generador del
      RSS reescribe esa frase.
    rederivar: >-
      python3 -c "import re;print(len(set(re.findall(r'lang=\"([a-zA-Z-]+)\"',
      open('about/best-ai-experts-thinkers-world.html').read()))))"   # -> 11
    verificado: "2026-11-11"
